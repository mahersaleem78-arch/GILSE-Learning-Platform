name: CI

on:
  push:
    branches: [integration, main]
  pull_request:
    branches: [integration, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_ANON_KEY: ci-test-anon-key

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/integration'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        run: npm run build
      - name: Tests
        run: npm test -- --run
      - name: Three consecutive validation passes
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            echo "=== VALIDATION PASS $round/3 ==="
            npm audit --audit-level=high
            npm run lint
            npm run build
            npm test -- --run
            echo "=== VALIDATION PASS $round/3: CLEAN ==="
          done
