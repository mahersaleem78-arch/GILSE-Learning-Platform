name: Transcribe Personal Brand Audio

on:
  workflow_dispatch:
  push:
    paths:
      - 'How to Build a Personal Brand (Full Course)(MP3_320K)*.mp3'

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pip

      - name: Install transcription tools
        run: pip install --upgrade faster-whisper reportlab

      - name: Transcribe all audio parts
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          import re

          files = list(Path('.').glob('How to Build a Personal Brand (Full Course)(MP3_320K)*.mp3'))
          def part_no(p):
              m = re.search(r'(\d+)\.mp3$', p.name)
              return int(m.group(1)) if m else 0
          files.sort(key=part_no)

          print('Found', len(files), 'audio parts')
          model = WhisperModel('small', device='cpu', compute_type='int8')
          out = Path('transcripts')
          out.mkdir(exist_ok=True)

          combined = []
          for audio in files:
              print('Transcribing:', audio.name)
              segments, info = model.transcribe(str(audio), language='en', vad_filter=True, beam_size=5)
              lines = []
              for s in segments:
                  text = s.text.strip()
                  if text:
                      lines.append(f'[{s.start:08.2f} --> {s.end:08.2f}] {text}')
              text = '\n'.join(lines)
              (out / f'{audio.stem}.txt').write_text(text, encoding='utf-8')
              combined.append(f'\n\n===== {audio.name} =====\n\n{text}')

          (out / 'FULL_TRANSCRIPT.txt').write_text(''.join(combined).strip(), encoding='utf-8')
          PY

      - name: Commit transcripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transcripts/
          git diff --cached --quiet || git commit -m 'Add Whisper transcripts for Personal Brand audio'
          git push
