<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maher AI — Career & Opportunity Agent</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#10233a;--text:#e8f0f7;--muted:#9db0c4;--line:#1d3550;--accent:#62d5c7;--danger:#ff8b8b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;background:linear-gradient(145deg,#07111f,#091a2b);color:var(--text);min-height:100vh}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px 15px;background:#07111fee;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:21px}.brand span{color:var(--accent)}.tag{font-size:12px;color:var(--muted);margin:6px 0 25px}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);padding:11px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.main{padding:26px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.title h1{font-size:29px;margin:0}.title p{margin:6px 0;color:var(--muted)}.pill{border:1px solid var(--line);padding:8px 11px;border-radius:999px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:linear-gradient(180deg,var(--panel),#0a1727);border:1px solid var(--line);border-radius:15px;padding:18px}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}.metric{font-size:28px;font-weight:800;margin-top:5px}.muted{color:var(--muted)}.small{font-size:12px}.btn{background:var(--accent);color:#04201d;border:0;padding:10px 14px;border-radius:9px;font-weight:750;cursor:pointer}.btn.secondary{background:#142a43;color:var(--text);border:1px solid var(--line)}.btn.danger{background:#482329;color:#ffd9d9}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#081524;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px}.field textarea{min-height:105px;resize:vertical}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:11px;padding:12px;background:#0a1727}.item h3{margin:0 0 5px;font-size:15px}.item p{margin:5px 0}.badge{display:inline-block;border:1px solid #28506e;background:#10283e;color:#a9d9ff;border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}.score{height:8px;background:#07111f;border-radius:99px;overflow:hidden}.score i{display:block;height:100%;background:var(--accent)}.chat{display:flex;flex-direction:column;height:550px}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:5px}.msg{max-width:85%;padding:11px 13px;border-radius:13px;line-height:1.5}.msg.user{align-self:flex-end;background:#16453f}.msg.agent{align-self:flex-start;background:#12253b;border:1px solid var(--line)}.chatbar{display:flex;gap:8px;margin-top:10px}.chatbar input{flex:1;background:#081524;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px}.hidden{display:none}.notice{border-left:3px solid var(--accent);padding:10px 12px;background:#0c2230;border-radius:8px}.footer{margin-top:25px;color:var(--muted);font-size:11px;text-align:center}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:15px}.span3,.span4,.span6,.span8{grid-column:span 12}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">Maher <span>AI</span></div><div class="tag">Career • Research • Business • Opportunity</div><div class="nav" id="nav">
<button class="active" data-page="dashboard">Dashboard</button><button data-page="profile">My Profile</button><button data-page="jobs">Jobs</button><button data-page="applications">Applications</button><button data-page="business">Opportunity Lab</button><button data-page="research">Research</button><button data-page="knowledge">Knowledge Base</button><button data-page="agent">AI Agent</button></div><div class="notice small" style="margin-top:18px">Zero-cost core. Your data stays in this browser until an optional backend is connected.</div></aside>
<main class="main"><div class="top"><div class="title"><h1 id="pageTitle">Maher AI</h1><p id="pageSub">Personal career and opportunity command center</p></div><div class="actions"><span class="pill">Local mode</span><button class="btn secondary" id="lang">العربية</button></div></div>
<section id="dashboard" class="page"></section><section id="profile" class="page hidden"></section><section id="jobs" class="page hidden"></section><section id="applications" class="page hidden"></section><section id="business" class="page hidden"></section><section id="research" class="page hidden"></section><section id="knowledge" class="page hidden"></section><section id="agent" class="page hidden"></section><div class="footer">Maher AI • provider-agnostic • no paid API required for the core workspace</div></main></div>
<script>
const KEY='maher-ai-v1';const defaults={profile:{name:'Maher Wael Salem',title:'Mechanical Engineer | Procurement • Operations • MEAL • Data • Technical Sales',location:'Syria / International Availability',skills:['Procurement','P2P / ERP','Project Coordination','MEAL','Data Analytics','Excel','Power BI','BOQ / Cost Estimation','Technical Sales','Engineering'],languages:['Arabic','English']},jobs:[],applications:[],ideas:[],research:[],knowledge:[],messages:[{role:'agent',text:'مرحبا مهندس ماهر 👋 أنا Maher AI. حاليا أعمل بوضع مجاني محلي. فيني أساعدك بتنظيم السيرة الذاتية والوظائف والفرص التجارية وتحويل أي فكرة إلى خطة اختبار عملية.'}]};let db=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaults);let arabic=false;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nav(page){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(page).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render(page)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));document.getElementById('lang').onclick=()=>{arabic=!arabic;render(document.querySelector('.page:not(.hidden)').id)};
function metric(n,l){return '<div class="card span3"><div class="muted small">'+l+'</div><div class="metric">'+n+'</div></div>'}
function render(p){if(p==='dashboard')renderDashboard();if(p==='profile')renderProfile();if(p==='jobs')renderJobs();if(p==='applications')renderApplications();if(p==='business')renderBusiness();if(p==='research')renderResearch();if(p==='knowledge')renderKnowledge();if(p==='agent')renderAgent()}
function renderDashboard(){dashboard.innerHTML='<div class="grid">'+metric(db.jobs.length,'Saved jobs')+metric(db.applications.length,'Applications')+metric(db.ideas.length,'Business ideas')+metric(db.knowledge.length,'Knowledge notes')+'<div class="card span8"><h2>Command center</h2><p class="muted">Start from your profile, then add jobs or ideas. The local engine produces transparent matches and experiments without a paid AI API.</p><div class="actions"><button class="btn" onclick="nav(\'profile\')">Complete profile</button><button class="btn secondary" onclick="nav(\'jobs\')">Add a job</button><button class="btn secondary" onclick="nav(\'business\')">Find an opportunity</button></div></div><div class="card span4"><h2>System</h2><p><span class="badge">Local storage</span><span class="badge">No paid API</span><span class="badge">RAG-ready</span></p><p class="small muted">Later: Supabase sync, web research connectors, multilingual voice and optional model providers.</p></div><div class="card span12"><h2>Next actions</h2><div class="list"><div class="item"><b>1.</b> Keep the master profile complete.</div><div class="item"><b>2.</b> Add real vacancies and paste requirements.</div><div class="item"><b>3.</b> Record outcomes so the agent can learn from applications and business tests.</div></div></div></div>'}
function renderProfile(){profile.innerHTML='<div class="grid"><div class="card span8"><h2>Master profile</h2><div class="field"><label>Name</label><input id="pname" value="'+esc(db.profile.name)+'"></div><div class="field"><label>Professional headline</label><input id="ptitle" value="'+esc(db.profile.title)+'"></div><div class="field"><label>Location / availability</label><input id="ploc" value="'+esc(db.profile.location)+'"></div><div class="field"><label>Skills — one per line</label><textarea id="pskills">'+esc(db.profile.skills.join('\n'))+'</textarea></div><div class="field"><label>Languages — one per line</label><textarea id="plangs">'+esc(db.profile.languages.join('\n'))+'</textarea></div><button class="btn" onclick="saveProfile()">Save profile</button></div><div class="card span4"><h2>Agent memory</h2><p class="muted">This becomes the evidence base for matching, CV tailoring and opportunity research.</p><div class="notice">No invented qualifications: the agent should use only user facts or verifiable sources.</div></div></div>'}
function saveProfile(){db.profile.name=pname.value;db.profile.title=ptitle.value;db.profile.location=ploc.value;db.profile.skills=pskills.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);db.profile.languages=plangs.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);save();alert('Profile saved');renderProfile()}
function match(text){let t=text.toLowerCase(),hits=db.profile.skills.filter(s=>t.includes(s.toLowerCase()));return {score:Math.min(100,Math.round(hits.length/Math.max(1,Math.min(db.profile.skills.length,8))*100)),hits}}
function renderJobs(){jobs.innerHTML='<div class="grid"><div class="card span4"><h2>Add vacancy</h2><div class="field"><label>Job title</label><input id="jtitle" placeholder="Procurement Assistant"></div><div class="field"><label>Organization</label><input id="jorg" placeholder="Organization"></div><div class="field"><label>Country / city</label><input id="jloc" placeholder="Germany / Berlin"></div><div class="field"><label>Requirements / vacancy text</label><textarea id="jtext"></textarea></div><div class="field"><label>Source URL</label><input id="jurl" placeholder="https://..."></div><button class="btn" onclick="addJob()">Save & match</button></div><div class="card span8"><h2>Saved jobs</h2><div class="list">'+(db.jobs.length?db.jobs.map((j,i)=>'<div class="item"><h3>'+esc(j.title)+' — '+esc(j.org)+'</h3><p class="muted small">'+esc(j.loc)+' · Match '+j.score+'%</p><div class="score"><i style="width:'+j.score+'%"></i></div><p class="small">'+esc(j.hits.join(', ')||'No direct skill matches yet')+'</p><div class="actions"><button class="btn secondary" onclick="makeApplication('+i+')">Create application</button><button class="btn danger" onclick="delJob('+i+')">Delete</button></div></div>').join(''):'<div class="muted">No jobs yet.</div>')+'</div></div></div>'}
function addJob(){let m=match(jtext.value+' '+jtitle.value);db.jobs.unshift({title:jtitle.value.trim()||'Untitled vacancy',org:jorg.value.trim(),loc:jloc.value.trim(),text:jtext.value,url:jurl.value.trim(),score:m.score,hits:m.hits,created:new Date().toISOString()});save();renderJobs()}
function delJob(i){db.jobs.splice(i,1);save();renderJobs()}function makeApplication(i){let j=db.jobs[i];db.applications.unshift({job:j.title,org:j.org,status:'Draft',date:new Date().toISOString().slice(0,10),notes:'Tailor CV and cover letter using verified profile evidence.'});save();nav('applications')}
function renderApplications(){applications.innerHTML='<div class="grid"><div class="card span12"><h2>Pipeline</h2><div class="list">'+(db.applications.length?db.applications.map((a,i)=>'<div class="item"><h3>'+esc(a.job)+' — '+esc(a.org)+'</h3><p><span class="badge">'+esc(a.status)+'</span> <span class="muted small">'+esc(a.date)+'</span></p><p class="muted small">'+esc(a.notes)+'</p><select onchange="statusApp('+i+',this.value)"><option '+(a.status==='Draft'?'selected':'')+'>Draft</option><option '+(a.status==='Ready'?'selected':'')+'>Ready</option><option '+(a.status==='Submitted'?'selected':'')+'>Submitted</option><option '+(a.status==='Interview'?'selected':'')+'>Interview</option><option '+(a.status==='Closed'?'selected':'')+'>Closed</option></select></div>').join(''):'<div class="muted">No applications yet.</div>')+'</div></div></div>'}
function statusApp(i,v){db.applications[i].status=v;save();renderApplications()}
function renderBusiness(){business.innerHTML='<div class="grid"><div class="card span4"><h2>Opportunity generator</h2><p class="muted small">Turn resources and problems into testable ideas, not promises.</p><div class="field"><label>Input</label><textarea id="ideaInput" placeholder="Example: engineering + procurement + social media skills and limited capital"></textarea></div><button class="btn" onclick="generateIdeas()">Generate ideas</button></div><div class="card span8"><h2>Ideas & experiments</h2><div class="list">'+(db.ideas.length?db.ideas.map((x,i)=>'<div class="item"><h3>'+esc(x.name)+'</h3><p>'+esc(x.hypothesis)+'</p><p class="small"><span class="badge">Demand test</span><span class="badge">Cost: '+esc(x.cost)+'</span></p><p class="muted small">Next test: '+esc(x.test)+'</p><button class="btn secondary" onclick="removeIdea('+i+')">Remove</button></div>').join(''):'<div class="muted">No ideas yet.</div>')+'</div></div></div>'}
function generateIdeas(){let input=ideaInput.value.trim()||db.profile.skills.join(', ');let ts=[['B2B sourcing micro-service','Help small contractors compare technical suppliers using procurement and engineering knowledge.','near-zero','Interview 5 contractors and offer one free supplier comparison.'],['Technical content lead generation','Create targeted engineering/procurement explainers that can attract qualified business inquiries.','near-zero','Publish 5 targeted posts and measure qualified inquiries.'],['BOQ review service','Offer a structured second-look service for BOQs, specifications and procurement lists.','near-zero','Review one sample BOQ and ask 5 potential clients whether the report is useful.']];ts.forEach(t=>db.ideas.unshift({name:t[0],hypothesis:t[1]+' Context: '+input,cost:t[2],test:t[3]}));save();renderBusiness()}
function removeIdea(i){db.ideas.splice(i,1);save();renderBusiness()}
function renderResearch(){research.innerHTML='<div class="grid"><div class="card span5"><h2>Research question</h2><div class="field"><label>Topic</label><input id="rq" placeholder="Engineering jobs and migration route"></div><div class="field"><label>What must be verified?</label><textarea id="rv" placeholder="Rules, qualifications, language, application route..."></textarea></div><button class="btn" onclick="addResearch()">Save research task</button></div><div class="card span7"><h2>Research queue</h2><div class="list">'+(db.research.length?db.research.map((r,i)=>'<div class="item"><h3>'+esc(r.q)+'</h3><p class="muted small">'+esc(r.v)+'</p><span class="badge">Needs sources</span> <button class="btn danger" onclick="delResearch('+i+')">Delete</button></div>').join(''):'<div class="muted">No research tasks.</div>')+'</div></div></div>'}
function addResearch(){db.research.unshift({q:rq.value.trim(),v:rv.value.trim(),date:new Date().toISOString()});save();renderResearch()}function delResearch(i){db.research.splice(i,1);save();renderResearch()}
function renderKnowledge(){knowledge.innerHTML='<div class="grid"><div class="card span5"><h2>Add knowledge</h2><div class="field"><label>Title</label><input id="kt"></div><div class="field"><label>Summary / notes</label><textarea id="kc"></textarea></div><div class="field"><label>Source</label><input id="ks" placeholder="URL or report reference"></div><button class="btn" onclick="addKnowledge()">Store</button></div><div class="card span7"><h2>Knowledge base</h2><div class="list">'+(db.knowledge.length?db.knowledge.map(k=>'<div class="item"><h3>'+esc(k.t)+'</h3><p>'+esc(k.c)+'</p><p class="small muted">'+esc(k.s)+'</p></div>').join(''):'<div class="muted">No knowledge entries yet.</div>')+'</div></div></div>'}
function addKnowledge(){db.knowledge.unshift({t:kt.value,c:kc.value,s:ks.value});save();renderKnowledge()}
function renderAgent(){agent.innerHTML='<div class="card chat"><div class="messages" id="msgs">'+db.messages.map(m=>'<div class="msg '+m.role+'">'+esc(m.text)+'</div>').join('')+'</div><div class="chatbar"><input id="chatInput" placeholder="Ask Maher AI..."><button class="btn" onclick="sendChat()">Send</button></div></div>'}
function sendChat(){let q=chatInput.value.trim();if(!q)return;db.messages.push({role:'user',text:q});let l=q.toLowerCase(),a;if(/job|وظيف|عمل|career/.test(l))a='ابدأ من Jobs: أضف نص الشاغر كما هو وسأحسب تطابقا أوليا بناء على مهارات ملفك الحالي. التطابق ليس ضمانا للقبول.';else if(/money|income|دخل|مال|business|مشروع/.test(l))a='استخدم Opportunity Lab. سأحوّل الفكرة إلى فرضية ثم اختبار صغير منخفض التكلفة بدل افتراض النجاح.';else if(/cv|سيرة/.test(l))a='ملفك الحالي هو Master Profile. بعد إضافة الخبرات والتعليم والشهادات يمكن بناء نسخ مخصصة لكل شاغر.';else a='فهمت طلبك. الوضع المحلي لا يستخدم API مدفوعا؛ حاليا أستطيع تنظيم بياناتك والمطابقة والتخطيط. يمكن إضافة نموذج اختياري لاحقا.';db.messages.push({role:'agent',text:a});save();renderAgent();chatInput.value=''}
nav('dashboard');
</script></body></html>
