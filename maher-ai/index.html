<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Maher AI — Autonomous Agent</title>
<style>
:root{--bg:#06101d;--panel:#0d1b2d;--panel2:#10253d;--text:#edf5fb;--muted:#9db0c4;--line:#1d3550;--accent:#62d5c7;--danger:#ff8b8b;--warn:#ffd27d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#12304b55,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial;min-height:100vh}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{border-left:1px solid var(--line);padding:20px 14px;background:#06101df2;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:23px}.brand b{color:var(--accent)}.tag{font-size:12px;color:var(--muted);margin:5px 0 24px}.nav button{display:block;width:100%;text-align:right;background:transparent;border:0;color:var(--muted);padding:11px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.main{padding:22px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title h1{font-size:28px;margin:0}.title p{margin:5px 0;color:var(--muted)}.pill{border:1px solid var(--line);padding:8px 11px;border-radius:999px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:linear-gradient(180deg,var(--panel),#091625);border:1px solid var(--line);border-radius:15px;padding:17px}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}.metric{font-size:28px;font-weight:850}.muted{color:var(--muted)}.small{font-size:12px}.btn{background:var(--accent);color:#04201d;border:0;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer}.btn.secondary{background:#142a43;color:var(--text);border:1px solid var(--line)}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#081524;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px}.field textarea{min-height:110px;resize:vertical}.hidden{display:none!important}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:11px;padding:12px;background:#0a1727}.item h3{margin:0 0 6px;font-size:15px}.badge{display:inline-block;border:1px solid #28506e;background:#10283e;color:#a9d9ff;border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}.notice{border-right:3px solid var(--accent);padding:10px 12px;background:#0c2230;border-radius:8px}.chat{display:flex;flex-direction:column;height:600px}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:5px}.msg{max-width:88%;padding:11px 13px;border-radius:13px;line-height:1.55;white-space:pre-wrap}.msg.user{align-self:flex-start;background:#16453f}.msg.agent{align-self:flex-end;background:#12253b;border:1px solid var(--line)}.chatbar{display:flex;gap:8px;margin-top:10px}.chatbar input{flex:1;background:#081524;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px}.status{font-size:12px;color:var(--muted);margin-top:8px}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:22px}@media(max-width:900px){.app{display:block}.side{position:relative;height:auto;border-left:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:12px}.s3,.s4,.s6,.s8{grid-column:span 12}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand">Maher <b>AI</b></div>
<div class="tag">Autonomous • Multi-model • Research • Career • Business</div>
<div class="nav" id="nav">
<button class="active" data-page="dashboard">لوحة القيادة</button>
<button data-page="agent">الوكيل</button>
<button data-page="tasks">المهام</button>
<button data-page="profile">الملف الشخصي</button>
<button data-page="jobs">الوظائف</button>
<button data-page="research">البحث</button>
<button data-page="business">الخدمات والأعمال</button>
<button data-page="goals">الأهداف والذاكرة</button>
</div>
<div class="notice small">العقل الأساسي سحابي. يمكن إضافة مزودي GPT وClaude وGemini من الخادم دون كشف مفاتيحهم للمتصفح.</div>
</aside>
<main class="main">
<div class="top"><div class="title"><h1 id="title">Maher AI</h1><p id="sub">وكيل شخصي لتنفيذ الأهداف وليس مجرد دردشة</p></div><span class="pill" id="connection">غير متصل</span></div>
<section id="dashboard" class="page"></section>
<section id="agent" class="page hidden"></section>
<section id="tasks" class="page hidden"></section>
<section id="profile" class="page hidden"></section>
<section id="jobs" class="page hidden"></section>
<section id="research" class="page hidden"></section>
<section id="business" class="page hidden"></section>
<section id="goals" class="page hidden"></section>
<div class="footer">Maher AI • Cloud-first • Multi-model ready • لا معاملات مالية داخل الوكيل</div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ajxtvvnqukxywanrcgsu.supabase.co";
const SUPABASE_KEY="sb_publishable_t-KX-hKNzjD6viWVp7V5VA_h0FBCVlU";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null,profile=null,tasks=[],goals=[],memories=[],messages=JSON.parse(localStorage.getItem("maher-ai-chat")||"[]");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function saveChat(){localStorage.setItem("maher-ai-chat",JSON.stringify(messages.slice(-100)))}
function go(p){document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));document.getElementById(p).classList.remove("hidden");document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));({dashboard:renderDashboard,agent:renderAgent,tasks:renderTasks,profile:renderProfile,jobs:renderJobs,research:renderResearch,business:renderBusiness,goals:renderGoals}[p])()}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
async function call(path,opt={}){if(!session)throw Error("سجل الدخول أولا");const r=await fetch(SUPABASE_URL+"/functions/v1/maher-ai-agent/"+path,{...opt,headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token}});const j=await r.json();if(!r.ok)throw Error(j.error||"خطأ في الخادم");return j}
const OWNER_EMAIL="mahersaleem78@gmail.com";
async function login(){
 const email=prompt("أدخل البريد الإلكتروني");
 if(!email)return;
 if(email.trim().toLowerCase()!==OWNER_EMAIL){
   alert("هذا التطبيق خاص بحساب Maher AI فقط.");
   return;
 }
 const {error}=await sb.auth.signInWithOtp({
   email:OWNER_EMAIL,
   options:{shouldCreateUser:false}
 });
 if(error){alert("تعذر إرسال رمز التحقق: "+error.message);return}
 const token=prompt("تم إرسال رمز التحقق إلى بريدك الإلكتروني. أدخل الرمز المكون من 6 أرقام");
 if(!token)return;
 const {data:verified,error:verifyError}=await sb.auth.verifyOtp({
   email:OWNER_EMAIL,
   token:token.trim(),
   type:"email"
 });
 if(verifyError){alert("رمز التحقق غير صحيح أو منتهي الصلاحية: "+verifyError.message);return}
 session=verified.session;
 await boot();
}
async function boot(){
 if(!session)return;
 connection.textContent="Agent online";
 try{profile=(await call("profile")).data;tasks=(await call("tasks")).data||[];goals=(await call("goals")).data||[];memories=(await call("memory")).data||[]}catch(e){connection.textContent="Backend error";return}
 renderDashboard()
}
function renderDashboard(){
 dashboard.innerHTML='<div class="grid">'+
 '<div class="card s3"><div class="muted small">المهام</div><div class="metric">'+tasks.length+'</div></div>'+
 '<div class="card s3"><div class="muted small">مستوى الاستقلالية</div><div class="metric">'+(profile?.autonomy_level??80)+'%</div></div>'+
 '<div class="card s3"><div class="muted small">النماذج</div><div class="metric">4</div></div>'+
 '<div class="card s3"><div class="muted small">الوضع</div><div class="metric">Cloud</div></div>'+
 '<div class="card s8"><h2>أعطه الهدف فقط</h2><p class="muted">الوكيل يخطط للمهمة ويختار الأدوات والنموذج المناسب عندما تكون مزودة ومهيأة على الخادم.</p><div class="actions"><button class="btn" onclick="go(\'agent\')">ابدأ مهمة</button><button class="btn secondary" onclick="go(\'tasks\')">شاهد المهام</button></div></div>'+
 '<div class="card s4"><h2>قواعد التشغيل</h2><p><span class="badge">ذاكرة</span><span class="badge">تخطيط</span><span class="badge">إعادة محاولة</span><span class="badge">Multi-model</span></p><p class="small muted">لا اختلاق للبيانات. لا تجاوز للتحقق. لا معاملات مالية.</p></div>'+
 '</div>'
}
function renderAgent(){
 if(!messages.length)messages=[{role:"agent",text:"أنا Maher AI. أعطني الهدف، وسأحوّله إلى خطة تنفيذ وأحفظ المهمة على الخادم."}];
 agent.innerHTML='<div class="card chat"><div class="messages" id="msgs">'+messages.map(m=>'<div class="msg '+m.role+'">'+esc(m.text)+'</div>').join("")+'</div><div class="chatbar"><input id="q" placeholder="مثال: ابحث عن أفضل فرص عمل مناسبة لخبرتي في أوروبا"><button class="btn" onclick="runTask()">تنفيذ</button></div><div id="agentStatus" class="status"></div></div>'
}
async function runTask(){
 const input=document.getElementById("q"),q=input.value.trim();if(!q)return;
 messages.push({role:"user",text:q});saveChat();renderAgent();document.getElementById("agentStatus").textContent="الوكيل يخطط وينفذ...";
 try{
   const created=await call("tasks",{method:"POST",body:JSON.stringify({instruction:q})});
   const result=await call("tasks/"+created.data.id+"/run",{method:"POST",body:"{}"});
   tasks.unshift(result.data);
   const r=result.data.result||{};
   let text="اكتملت دورة الوكيل.\n\nالنوع: "+(r.type||"general");
   if(r.plan?.steps)text+="\n\nالخطة:\n"+r.plan.steps.map((x,i)=>(i+1)+". "+x).join("\n");
   if(r.actions?.length)text+="\n\nالإجراء:\n"+JSON.stringify(r.actions,null,2);
   if(r.llm)text+="\n\nتحليل النموذج:\n"+r.llm;
   messages.push({role:"agent",text});saveChat();renderAgent()
 }catch(e){messages.push({role:"agent",text:"تعذر التنفيذ: "+e.message});saveChat();renderAgent()}
}
function renderTasks(){
 tasks=document.getElementById("tasks")?tasks:tasks;
 document.getElementById("tasks").innerHTML='<div class="grid"><div class="card s12"><h2>المهام المستقلة</h2><div class="list">'+(window.taskList?.length?window.taskList.map(t=>"<div></div>").join(""):"")+'</div></div></div>';
 // render from current array
 document.getElementById("tasks").innerHTML='<div class="card"><h2>المهام المستقلة</h2><div class="list">'+(tasks.length?tasks.map(t=>'<div class="item"><h3>'+esc(t.title)+'</h3><p class="small muted">'+esc(t.task_type)+' · '+esc(t.status)+'</p><p>'+esc(t.instruction)+'</p><button class="btn secondary" onclick="rerun(\''+t.id+'\')">إعادة التنفيذ</button></div>').join(""):'<div class="muted">لا توجد مهام.</div>')+'</div></div>'
}
async function rerun(id){try{const r=await call("tasks/"+id+"/run",{method:"POST",body:"{}"});tasks.unshift(r.data);renderTasks()}catch(e){alert(e.message)}}
function renderProfile(){
 const p=profile||{};document.getElementById("profile").innerHTML='<div class="card"><h2>الملف الأساسي</h2><div class="field"><label>الاسم</label><input id="pn" value="'+esc(p.name)+'"></div><div class="field"><label>العنوان المهني</label><input id="ph" value="'+esc(p.headline)+'"></div><div class="field"><label>الموقع</label><input id="pl" value="'+esc(p.location)+'"></div><div class="field"><label>المهارات — كل مهارة في سطر</label><textarea id="ps">'+esc((p.skills||[]).join("\n"))+'</textarea></div><button class="btn" onclick="saveProfile()">حفظ</button></div>'
}
async function saveProfile(){try{const r=await call("profile",{method:"POST",body:JSON.stringify({name:pn.value,headline:ph.value,location:pl.value,skills:ps.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean),languages:profile?.languages||[],goals:profile?.goals||[],autonomy_level:profile?.autonomy_level??80})});profile=r.data;alert("تم الحفظ")}catch(e){alert(e.message)}}
function renderGoals(){
 document.getElementById("goals").innerHTML='<div class="grid"><div class="card s6"><h2>الأهداف النشطة</h2><div class="list">'+(goals.length?goals.map(g=>'<div class="item"><h3>'+esc(g.title)+'</h3><p>'+esc(g.description)+'</p><span class="badge">أولوية '+g.priority+'</span><span class="badge">تقدم '+g.progress+'%</span></div>').join(""):'<div class="muted">لا توجد أهداف بعد</div>')+'</div><div class="field"><label>هدف جديد</label><input id="goalTitle" placeholder="مثال: الحصول على 5 فرص عمل مناسبة"></div><div class="field"><label>الوصف</label><textarea id="goalDesc" placeholder="ما النتيجة التي تريد من الوكيل الوصول إليها؟"></textarea></div><button class="btn" onclick="addGoal()">إضافة هدف</button> <button class="btn secondary" onclick="nextAction()">ما الخطوة التالية؟</button></div><div class="card s6"><h2>الذاكرة طويلة الأمد</h2><div class="list">'+(memories.length?memories.slice(0,30).map(m=>'<div class="item"><p>'+esc(m.content)+'</p><span class="badge">'+esc(m.memory_type)+'</span><span class="badge">أهمية '+m.importance+'</span></div>').join(""):'<div class="muted">لا توجد ذاكرة بعد</div>')+'</div><div class="field"><label>أضف معلومة مهمة للوكيل</label><textarea id="memContent" placeholder="معلومة تريد من الوكيل تذكرها"></textarea></div><button class="btn" onclick="addMemory()">حفظ في الذاكرة</button></div></div>'
}
async function addGoal(){try{const r=await call("goals",{method:"POST",body:JSON.stringify({title:goalTitle.value,description:goalDesc.value,priority:80})});goals.unshift(r.data);renderGoals()}catch(e){alert(e.message)}}
async function addMemory(){try{const r=await call("memory",{method:"POST",body:JSON.stringify({content:memContent.value,importance:70})});memories.unshift(r.data);renderGoals()}catch(e){alert(e.message)}}
async function nextAction(){try{const r=await call("next");alert(r.data.advice||"لا توجد توصية")}catch(e){alert(e.message)}}
function renderJobs(){document.getElementById("jobs").innerHTML='<div class="grid"><div class="card s5"><h2>أضف شاغرًا</h2><div class="field"><label>العنوان</label><input id="jt"></div><div class="field"><label>الجهة</label><input id="jo"></div><div class="field"><label>نص الإعلان</label><textarea id="jx"></textarea></div><button class="btn" onclick="addJob()">حفظ</button></div><div class="card s7"><h2>ملاحظة</h2><p class="muted">النسخة الحالية تسجل الشواغر يدويًا. الخطوة التالية هي إضافة موصلات بحث عامة ومسموح بها للوظائف.</p></div></div>'}
function renderResearch(){document.getElementById("research").innerHTML='<div class="card"><h2>البحث</h2><p class="muted">أعط الوكيل سؤال البحث من صفحة الوكيل. سيحفظ المهمة والنتيجة.</p></div>'}
function renderBusiness(){document.getElementById("business").innerHTML='<div class="card"><h2>الخدمات والأعمال</h2><p class="muted">اطلب من الوكيل ابتكار خدمة، اختبار الطلب عليها، إعداد العرض، وبناء خطة الوصول للعملاء.</p></div>'}
async function addJob(){try{await call("jobs",{method:"POST",body:JSON.stringify({title:jt.value,organization:jo.value,description:jx.value})});alert("تم الحفظ")}catch(e){alert(e.message)}}
(async()=>{const {data}=await sb.auth.getSession();session=data.session;if(session)await boot();else{connection.textContent="سجل الدخول";go("dashboard");login()}})();
</script>
</body></html>
